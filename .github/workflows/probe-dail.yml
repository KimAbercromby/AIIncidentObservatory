name: Probe DAIL (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node probe-dail.mjs
      - run: |
          git config user.name "observatory-bot"
          git config user.email "observatory-bot@users.noreply.github.com"
          git pull --rebase origin main
          git add dail-probe.json
          git commit -m "probe: DAIL data access"
          git push
